
    @for (user of users(); track  user) {      
        <mat-card class="card">
            <mat-card-content class="card-content">
               <span>{{user.name | titlecase | truncate:10}}</span> 
               <button class="action-button" appErrorBtn matButton="filled" (click)="remove(user.id)">Remove</button>
            </mat-card-content>
        </mat-card>
    }
