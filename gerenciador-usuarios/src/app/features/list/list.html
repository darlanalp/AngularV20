<div class="action-container">
    <app-search-input [(search)]="search" />
    <div class="button-action">
        <a matButton="elevated" routerLink="/create">Criar Usuário</a>
    </div>
</div>
@if (isLoading()) {
<div>Loading...</div>
}
@else{
<app-users-list 
   [users]="users()" 
   (remove)="remove($event)" 
   (edit)="edit($event)"/>
}
