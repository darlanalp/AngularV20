<form [formGroup]="form" (ngSubmit)="submit()" class="form-container">

    <mat-form-field>
        <mat-label>Nome do usuário:</mat-label>
        <input matInput placeholder="digite o nome do usuário" required type="text" formControlName="name" />
        @if (form.controls.name.errors?.['required']) {
        <mat-error>Campo obrigatório</mat-error>
        }
    </mat-form-field>

    <div class="actions-container">
        <button type="button" matButton="elevated" routerLink="/">Cancelar</button>
        <button matButton="filled" [disabled]="form.invalid">Atualizar usuário</button>
    </div>

</form>
